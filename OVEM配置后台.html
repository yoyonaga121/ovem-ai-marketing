<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OVEM 配置后台</title>
<style>
  :root{
    --bg:#F5F7FB;--surface:#FFFFFF;--surface-2:#F8FAFE;--line:#E3E8F2;--line-2:#D4DBE9;
    --ink:#0F1B2D;--ink-2:#4A5769;--ink-3:#7E8CA2;
    --brand:#1E3A8A;--brand-2:#2F6FED;--tint:#EDF2FC;--teal:#0E8F8C;--gold:#A1741F;
    --ok:#15803D;--warn:#B45309;--danger:#B42318;
    --r:12px;--r-sm:8px;--shadow:0 1px 2px rgba(15,27,45,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
    font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:12.5px;color:var(--ink)}
  a{color:inherit;text-decoration:none}

  /* ---------------- 顶栏 ---------------- */
  .appbar{
    height:58px;display:flex;align-items:center;gap:18px;
    padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:30;
  }
  .ab-brand{display:flex;align-items:center;gap:10px;min-width:0}
  .ab-mark{width:30px;height:28px;object-fit:contain;flex:none}
  .ab-t{display:flex;flex-direction:column;line-height:1.15}
  .ab-t b{font-size:13.5px;letter-spacing:.02em;white-space:nowrap}
  .ab-t span{font-size:10px;color:var(--ink-3);letter-spacing:.06em;white-space:nowrap}
  .ab-div{width:1px;height:22px;background:var(--line)}
  .ab-crumb{font-size:11.5px;color:var(--ink-3)}
  .ab-crumb b{color:var(--ink-2);font-weight:600}
  .ab-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .env-pill{
    display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-3);
    border:1px dashed var(--line-2);border-radius:999px;padding:4px 10px;background:var(--surface-2);
  }
  .env-dot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
  .save-state{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3);margin-right:2px}
  .save-state .dot{width:6px;height:6px;border-radius:50%;background:#B9C4D6}
  .save-state.is-dirty{color:var(--warn)}
  .save-state.is-dirty .dot{background:var(--warn)}
  .save-state.is-saved{color:var(--ok)}
  .save-state.is-saved .dot{background:var(--ok)}
  .btn{
    height:32px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line-2);
    background:var(--surface);font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;
    white-space:nowrap;flex:none;
    transition:border-color .15s,color .15s,background .15s;
  }
  .btn:hover{border-color:var(--brand-2);color:var(--brand)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:#16306F;border-color:#16306F;color:#fff}
  .btn.ghost{background:transparent}
  .btn.sm{height:28px;padding:0 10px;font-size:11.5px}
  .btn.danger:hover{border-color:#E7B7B2;color:var(--danger)}

  /* ---------------- 布局 ---------------- */
  .shell{display:grid;grid-template-columns:216px minmax(0,1fr) 372px;height:calc(100vh - 58px)}
  .side{
    background:var(--surface);border-right:1px solid var(--line);
    padding:16px 12px 20px;overflow-y:auto;
  }
  .nav-group{margin-bottom:18px}
  .nav-label{font-size:9.5px;letter-spacing:.14em;color:#9AA9C0;padding:0 10px;margin-bottom:6px}
  .nav-item{
    display:flex;align-items:center;gap:9px;height:34px;padding:0 10px;border-radius:7px;
    color:var(--ink-2);font-size:12.5px;position:relative;margin-bottom:2px;border:1px solid transparent;
  }
  .nav-item svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;color:#8A97AC;flex:none}
  .nav-item:hover{background:var(--surface-2);color:var(--ink)}
  .nav-item.is-on{background:var(--tint);color:var(--brand);font-weight:600;border-color:#DCE6FB}
  .nav-item.is-on svg{color:var(--brand)}
  .nav-item .n-badge{
    margin-left:auto;font-size:9.5px;color:var(--ink-3);background:#F1F4F9;border-radius:4px;padding:1px 5px;
  }
  .nav-item.is-on .n-badge{background:#fff;color:var(--brand)}
  .side-note{
    margin-top:22px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;
    background:var(--surface-2);font-size:10.5px;color:var(--ink-3);line-height:1.65;
  }
  .side-note b{display:block;color:var(--ink-2);font-size:11px;margin-bottom:4px}

  .main{padding:24px 28px 70px;overflow-y:auto;min-width:0}
  .pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}
  .pagehead h1{font-size:21px;font-weight:700;letter-spacing:-.01em}
  .pagehead p{font-size:12px;color:var(--ink-3);margin-top:5px;max-width:620px}
  .pagehead .acts{display:flex;gap:8px;flex:none}

  .preview{
    border-left:1px solid var(--line);background:var(--surface-2);
    padding:18px 16px 26px;overflow-y:auto;
  }
  .pv-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .pv-head b{font-size:12.5px}
  .pv-head span{font-size:10px;color:var(--ink-3)}
  .pv-hero{
    background:#0B1424;border-radius:10px;padding:15px 15px 0;color:#fff;overflow:hidden;
    box-shadow:0 8px 24px rgba(11,20,36,.18);
  }
  .pv-kicker{font-size:8.5px;letter-spacing:.10em;color:rgba(255,255,255,.55);margin-bottom:8px}
  .pv-title{font-size:16px;line-height:1.42;font-weight:700;letter-spacing:-.01em}
  .pv-sub{font-size:9.5px;line-height:1.6;color:rgba(255,255,255,.66);margin-top:7px}
  .pv-roles{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
  .pv-roles span{font-size:8.5px;color:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:2px 7px}
  .pv-metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:rgba(255,255,255,.12);margin-top:14px}
  .pv-metrics div{background:#0B1424;padding:8px 6px 9px;text-align:center}
  .pv-metrics b{display:block;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
  .pv-metrics b em{font-style:normal;font-size:9px;margin-left:1px}
  .pv-metrics span{display:block;font-size:7.5px;color:rgba(255,255,255,.55);margin-top:2px;line-height:1.35}

  .pv-block{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 13px}
  .pv-block h4{font-size:10px;letter-spacing:.08em;color:var(--ink-3);margin-bottom:9px;font-weight:600}
  .pv-row{display:flex;align-items:center;justify-content:space-between;font-size:11px;padding:5px 0;border-bottom:1px dashed #EEF1F7}
  .pv-row:last-child{border-bottom:0}
  .pv-row span{color:var(--ink-3)}
  .pv-row b{font-variant-numeric:tabular-nums;color:var(--ink)}
  .pv-bar{margin-bottom:7px}
  .pv-bar-top{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-2);margin-bottom:3px}
  .pv-bar-track{height:5px;background:#EEF2F9;border-radius:3px;overflow:hidden}
  .pv-bar-fill{height:100%;background:linear-gradient(90deg,#2F6FED,#1E3A8A);border-radius:3px}
  .pv-warn{
    margin-top:12px;border:1px solid #F0DDBB;background:#FDF7EC;border-radius:8px;
    padding:9px 10px;font-size:10px;line-height:1.6;color:#8A5A12;
  }
  .pv-warn b{color:#6B430C}
  .pv-foot{margin-top:14px;font-size:9.5px;color:#9AA9C0;line-height:1.6}

  /* ---------------- 通用卡片 ---------------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}
  .card-head h3{font-size:13.5px;font-weight:700}
  .card-head p{font-size:11px;color:var(--ink-3);margin-top:3px;max-width:640px}
  .card-head .hint{font-size:10px;color:var(--ink-3);white-space:nowrap}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px}
  .stat .k{font-size:10px;letter-spacing:.06em;color:var(--ink-3)}
  .stat .v{font-size:27px;font-weight:700;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--brand)}
  .stat .v small{font-size:11px;font-weight:400;color:var(--ink-3);margin-left:4px}
  .stat .f{font-size:10.5px;color:var(--ink-3);margin-top:5px}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

  /* ---------------- 表单 ---------------- */
  .field{margin-bottom:13px}
  .field label{display:block;font-size:10.5px;color:var(--ink-3);margin-bottom:5px;letter-spacing:.03em}
  .field input,.field select,.field textarea{
    width:100%;border:1px solid var(--line-2);border-radius:var(--r-sm);
    padding:8px 10px;background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(47,111,237,.10)}
  .field textarea{resize:vertical;min-height:64px;line-height:1.7}
  .field .sub{font-size:10px;color:#9AA9C0;margin-top:4px}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

  /* ---------------- 开关 ---------------- */
  .switch{position:relative;display:inline-block;width:30px;height:17px;flex:none}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .switch i{position:absolute;inset:0;background:#DCE2EE;border-radius:999px;transition:background .18s;pointer-events:none}
  .switch i::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;background:#fff;border-radius:50%;transition:transform .18s;box-shadow:0 1px 2px rgba(15,27,45,.18)}
  .switch input:checked + i{background:var(--brand-2)}
  .switch input:checked + i::after{transform:translateX(13px)}
  .switch input:focus-visible + i{outline:2px solid var(--brand-2);outline-offset:2px}

  /* ---------------- 产品列表 ---------------- */
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .search{position:relative;flex:1;min-width:180px}
  .search input{width:100%;height:32px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:0 10px 0 30px;background:var(--surface);outline:none}
  .search input:focus{border-color:var(--brand-2)}
  .search svg{position:absolute;left:9px;top:9px;width:14px;height:14px;stroke:#9AA9C0;fill:none;stroke-width:1.8}
  .toolbar select{height:32px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:0 8px;background:var(--surface)}
  .toolbar .count{font-size:11px;color:var(--ink-3);margin-left:auto}

  .plist{display:flex;flex-direction:column}
  .prow{padding:10px 0;border-bottom:1px solid #EEF1F7}
  .prow:last-child{border-bottom:0}
  .prow.is-off{opacity:.55}
  .prow-top{display:grid;grid-template-columns:34px 32px minmax(150px,1.6fr) minmax(86px,.8fr) 76px 62px 84px;gap:8px;align-items:center}
  .prow input[data-pfield="price"]{text-align:right;padding-right:8px;font-variant-numeric:tabular-nums}
  .pno{font-size:10px;color:#9AA9C0;font-variant-numeric:tabular-nums;letter-spacing:.04em}
  .prow input,.prow select{
    height:30px;border:1px solid var(--line);border-radius:6px;padding:0 7px;background:var(--surface);width:100%;min-width:0;
  }
  .prow input:focus,.prow select:focus{border-color:var(--brand-2);outline:none}
  .prow-bottom{padding-left:74px;margin-top:6px}
  .prow-bottom input{height:28px;font-size:11.5px;color:var(--ink-2);background:var(--surface-2)}

  /* ---------------- 渠道 ---------------- */
  .chgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chcard{border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:var(--surface-2)}
  .chcard.is-off{opacity:.55}
  .ch-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .ch-top .switch{transform:scale(.92);transform-origin:left center}
  .ch-name{font-size:12.5px;font-weight:600;border:0;background:transparent;padding:0;height:22px;flex:1;min-width:0}
  .ch-name:focus{outline:none;background:#fff;border-radius:4px;box-shadow:0 0 0 2px rgba(47,111,237,.14)}
  .ch-fields{display:grid;grid-template-columns:1fr 1.35fr .9fr;gap:6px}
  .ch-fields input{height:27px;border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:11px;background:#fff;width:100%;min-width:0}
  .ch-fields input:focus{border-color:var(--brand-2);outline:none}

  /* ---------------- 页面开关 ---------------- */
  .pagegroup{margin-bottom:14px}
  .pagegroup h4{font-size:10.5px;letter-spacing:.1em;color:var(--ink-3);margin-bottom:7px}
  .pagelist{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .pageitem{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--surface)}
  .pageitem.is-locked{background:var(--surface-2)}
  .pageitem .pcode{font-size:9.5px;color:#9AA9C0;letter-spacing:.06em;width:22px}
  .pageitem .pname{font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pageitem .lock{margin-left:auto;font-size:9px;color:#9AA9C0}
  .pageitem .switch{margin-left:auto}

  /* ---------------- 发布 / 差异 ---------------- */
  .diff{border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .diff-row{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-bottom:1px solid #EEF1F7;background:#fff}
  .diff-row:last-child{border-bottom:0}
  .diff-row .tag{font-size:9.5px;border-radius:4px;padding:2px 6px;background:#FDF3E3;color:var(--gold);flex:none}
  .diff-row .txt{font-size:11.5px;color:var(--ink-2)}
  .diff-empty{padding:22px;text-align:center;color:var(--ink-3);font-size:11.5px}

  .code{
    background:#0B1424;color:#D6E1F5;border-radius:9px;padding:14px 15px;font-family:Consolas,"Cascadia Mono",monospace;
    font-size:10.5px;line-height:1.7;overflow:auto;max-height:280px;white-space:pre;
  }
  .copy-line{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:12px}
  .copy-line code{font-family:Consolas,monospace;font-size:11px;color:var(--ink-2)}

  .checklist{display:flex;flex-direction:column;gap:7px}
  .check{display:flex;align-items:flex-start;gap:8px;font-size:11.5px;color:var(--ink-2)}
  .check .ok{width:14px;height:14px;border-radius:50%;background:#E8F3EC;color:var(--ok);font-size:9px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
  .check .warn{width:14px;height:14px;border-radius:50%;background:#FDF3E3;color:var(--warn);font-size:9px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}

  .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .quick button{
    text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:13px 14px;
    transition:border-color .15s,box-shadow .15s;
  }
  .quick button:hover{border-color:var(--brand-2);box-shadow:0 4px 14px rgba(30,58,138,.08)}
  .quick b{display:block;font-size:12px;color:var(--ink)}
  .quick span{display:block;font-size:10.5px;color:var(--ink-3);margin-top:3px}

  /* ---------------- toast ---------------- */
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);
    background:#0B1424;color:#fff;font-size:12px;padding:9px 16px;border-radius:999px;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70;box-shadow:0 8px 24px rgba(11,20,36,.24);
  }
  .toast.is-on{opacity:1;transform:translate(-50%,0)}

  /* ---------------- 响应式 ---------------- */
  @media (max-width:1280px){
    .shell{grid-template-columns:200px minmax(0,1fr) 320px}
    .main{padding:20px 20px 60px}
  }
  @media (max-width:1120px){
    .shell{grid-template-columns:200px minmax(0,1fr)}
    .preview{display:none}
  }
  @media (max-width:860px){
    .shell{grid-template-columns:1fr;height:auto}
    .side{display:flex;gap:6px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}
    .nav-group{display:flex;gap:4px;margin:0}
    .nav-label,.side-note{display:none}
    .nav-item{white-space:nowrap}
    .main{padding:18px 14px 50px}
    .stats{grid-template-columns:1fr 1fr}
    .grid-2,.grid-3,.quick,.chgrid,.pagelist{grid-template-columns:1fr}
    .row-3{grid-template-columns:1fr 1fr}
    .prow-top{grid-template-columns:34px 30px minmax(120px,1fr) 70px 58px;gap:6px}
    .prow-top select:nth-of-type(2){display:none}
    .prow-bottom{padding-left:0}
  }
  @media (max-width:860px){
    .appbar{gap:10px;padding:0 12px}
    .ab-div,.ab-crumb,.env-pill,.ab-t span{display:none}
    .ab-right{gap:6px}
    .save-state{margin-right:0}
    .btn.sm{padding:0 8px;font-size:11px}
  }
  @media (max-width:600px){
    .appbar{flex-wrap:wrap;height:auto;min-height:52px;padding:8px 12px;row-gap:8px}
    .ab-right{margin-left:auto;width:100%;justify-content:flex-end;flex-wrap:wrap}
    .shell{height:auto}
    .pagehead{flex-direction:column;align-items:stretch;gap:10px}
    .pagehead .acts{display:none}
  }
</style>
</head>
<body>

<header class="appbar">
  <div class="ab-brand">
    <img class="ab-mark" src="assets/img/brand/logo.png" alt="OVEM">
    <div class="ab-t">
      <b>OVEM 配置后台</b>
      <span>MARKETING OS · V2 CONFIG</span>
    </div>
  </div>
  <div class="ab-div"></div>
  <div class="ab-crumb">配置中心　/　<b id="crumb">概览</b></div>
  <div class="ab-right">
    <span class="env-pill"><span class="env-dot"></span><span id="envText">本地演示环境 · file://</span></span>
    <span class="save-state" id="saveState"><span class="dot"></span><span id="saveText">已同步</span></span>
    <button class="btn sm" id="btnReset" title="恢复默认配置">恢复默认</button>
    <button class="btn sm" id="btnOpen" title="保存并打开前台站点">应用并预览</button>
    <button class="btn primary sm" id="btnSave">保存配置</button>
  </div>
</header>

<div class="shell">
  <aside class="side" id="sideNav"></aside>
  <main class="main">
    <div class="pagehead" id="pageHead"></div>
    <div id="viewRoot"></div>
  </main>
  <aside class="preview" id="previewPane"></aside>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
/* ============================================================
   1 · 默认配置（与前台 OVEM_AI营销系统.html 当前数据一致）
   ============================================================ */
const DEFAULT_CFG = {
  meta:{version:"v1.0", note:"", updated:""},
  brand:{name:"OVEM", sub:"Optics Valley Effect", sub2:"Marketing OS", full:"光谷效应", edition:"2025–2026"},
  hero:{
    kicker:"虚拟品牌全案 · 2026.11 · 豆包 / 千问 / WorkBuddy",
    title:"把一次品牌全案，\n做成一条产线",
    sub:"光谷效应 Optics Valley Effect　·　20 款消费级生活机器人　·　8 个内容渠道",
    roles:["AI 营销经理","AI 视觉设计师","AI 产品经理"]
  },
  metrics:[
    {v:20, unit:"", label:"已定义 SKU"},
    {v:8,  unit:"", label:"内容渠道"},
    {v:160,unit:"", label:"基础物料位"},
    {v:480,unit:"", label:"含 A/B 变体"},
    {v:62, unit:"%",label:"单条成本降幅（测算）"}
  ],

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function nowStr(){
  const d = new Date();
  const p = n=>String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate())
    + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

function mergeCfg(base, patch){
  const out = clone(base);
  if(patch.meta) out.meta = Object.assign({}, out.meta, patch.meta);
  if(patch.brand) out.brand = Object.assign({}, out.brand, patch.brand);
  if(patch.hero) out.hero = Object.assign({}, out.hero, patch.hero);
  if(Array.isArray(patch.metrics) && patch.metrics.length) out.metrics = clone(patch.metrics);
  if(patch.goals) out.goals = Object.assign({}, out.goals, patch.goals);
  if(Array.isArray(patch.products) && patch.products.length){
    out.products = out.products.map(p=>{
      const c = patch.products.find(x=>x && x.id === p.id);
      return c ? Object.assign({}, p, c) : p;
    });
  }
  if(Array.isArray(patch.channels) && patch.channels.length){
    out.channels = out.channels.map((ch, i)=>{
      const c = patch.channels.find(x=>x && (x.origName || x.name) === (ch.origName || ch.name)) || patch.channels[i];
      return c ? Object.assign({}, ch, c) : ch;
    });
  }
  if(patch.pages) out.pages = Object.assign({}, out.pages, patch.pages);
  return out;
}

function loadCfg(){
  let base = clone(DEFAULT_CFG);
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) base = mergeCfg(base, JSON.parse(raw));
  }catch(e){}
  return base;
}

function diffList(){
  const base = DEFAULT_CFG, rows = [];
  const changed = (a, b)=>JSON.stringify(a) !== JSON.stringify(b);

  if(changed(base.brand, cfg.brand)) rows.push({tag:"品牌", txt:"品牌标识、全称或版本年份已修改"});
  if(changed(base.hero, cfg.hero)) rows.push({tag:"封面", txt:"封面眉标、主标、副标或身份标签已修改"});
  if(changed(base.metrics, cfg.metrics)) rows.push({tag:"指标", txt:"封面五项指标已修改"});
  if(changed(base.goals, cfg.goals)) rows.push({tag:"目标", txt:"年度经营目标已修改"});

  const keyOf = p=>[p.name,p.short,p.tier,p.wave,p.price,p.oneliner,p.enabled !== false].join("|");
  const changedP = cfg.products.filter((p,i)=>base.products[i] && keyOf(p) !== keyOf(base.products[i])).length;
  const offP = cfg.products.filter(p=>p.enabled === false).length;
  if(changedP || offP){
    const t = [];
    if(changedP) t.push(changedP + " 款字段修改");
    if(offP) t.push(offP + " 款停用");
    rows.push({tag:"产品", txt:t.join("，") + "（共 " + cfg.products.length + " 款）"});
  }

  const chKey = x=>{ const o = Object.assign({}, x); delete o.origName; return JSON.stringify(o); };
  const changedC = cfg.channels.filter((c,i)=>base.channels[i] && chKey(c) !== chKey(base.channels[i])).length;
  const offC = cfg.channels.filter(c=>c.enabled === false).length;
  if(changedC || offC){
    const t = [];
    if(changedC) t.push(changedC + " 个渠道字段修改");
    if(offC) t.push(offC + " 个渠道停用");
    rows.push({tag:"渠道", txt:t.join("，")});
  }

  const hidden = PAGE_META.filter(p=>cfg.pages[p.id] === false);
  if(hidden.length) rows.push({tag:"页面", txt:"隐藏 " + hidden.length + " 页：" + hidden.map(p=>p.no).join("、")});

  if(cfg.meta.version !== base.meta.version) rows.push({tag:"版本", txt:"配置版本 " + base.meta.version + " → " + cfg.meta.version});
  return rows;
}

function renderDiff(rows, empty){
  if(!rows.length) return '<div class="diff-empty">' + empty + "</div>";
  return '<div class="diff">' + rows.map(r=>'<div class="diff-row"><span class="tag">' + r.tag + '</span><div class="txt">' + esc(r.txt) + "</div></div>").join("") + "</div>";
}

function updateSaveState(){
  const dirty = JSON.stringify(cfg) !== savedSnap;
  const el = $("#saveState");
  if(dirty){
    el.className = "save-state is-dirty";
    $("#saveText").textContent = "有未保存变更";
  } else if(!cfg.meta.updated){
    el.className = "save-state";
    $("#saveText").textContent = "默认配置";
  } else {
    el.className = "save-state is-saved";
    $("#saveText").textContent = "已保存";
  }
}

function onChange(){
  renderPreview();
  updateSaveState();
}

function syncCounts(){
  const p = enabledProducts().length, c = enabledChannels().length;
  cfg.metrics[0].v = p;
  cfg.metrics[1].v = c;
  cfg.metrics[2].v = p * c;
  cfg.metrics[3].v = p * c * 3;
  cfg.hero.sub = cfg.brand.full + " " + cfg.brand.sub + "　·　" + p + " 款消费级生活机器人　·　" + c + " 个内容渠道";
}

function saveCfg(silent){
  cfg.channels.forEach(ch=>{ ch.count = Number(ch.count) || 0; });
  cfg.meta.updated = nowStr();
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(cfg));
    savedSnap = JSON.stringify(cfg);
    updateSaveState();
    if(!silent) toast("配置已保存，前台刷新后生效");
  }catch(e){
    toast("浏览器禁止本地存储，请改用「导出 ovem-config.js」");
  }
}

function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("is-on");
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove("is-on"), 2200);
}

function buildJS(){
  const head = "/* OVEM V2 展示配置 · 由配置后台生成 · " + nowStr() + " */\n"
    + "/* 用法：与 OVEM_AI营销系统.html 同目录，主站已内置 <script src=\"ovem-config.js\"> */\n";
  return head + "window.OVEM_CONFIG = " + JSON.stringify(cfg, null, 2) + ";\n";
}

function download(name, text, mime){
  const blob = new Blob([text], {type:mime || "text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function copyText(text, okMsg){
  const done = ()=>toast(okMsg || "已复制");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){ toast("复制失败，请手动选中"); }
    ta.remove();
  }
}

function applyProductFilter(){
  const q = pFilter.q.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll("#prodList .prow").forEach(row=>{
    const okQ = !q || (row.dataset.search || "").toLowerCase().includes(q);
    const okT = pFilter.tier === "全部" || row.dataset.tier === pFilter.tier;
    const on = okQ && okT;
    row.style.display = on ? "" : "none";
    if(on) shown++;
  });
  const cnt = $("#prodCount");
  if(cnt) cnt.textContent = "显示 " + shown + " / " + cfg.products.length;
}

$("#sideNav").addEventListener("click", e=>{
  const b = e.target.closest("[data-nav]");
  if(!b) return;
  view = b.dataset.nav;
  renderView();
  $(".main").scrollTop = 0;
});

$("#pageHead").addEventListener("click", e=>{
  const b = e.target.closest("[data-act]");
  if(b) doAction(b.dataset.act);
});

$("#viewRoot").addEventListener("click", e=>{
  const b = e.target.closest("[data-act]");
  if(b) doAction(b.dataset.act);
  const n = e.target.closest("[data-nav]");
  if(n){ view = n.dataset.nav; renderView(); }
});

function doAction(act){
  if(act === "save"){ saveCfg(); return; }
  if(act === "open"){ saveCfg(true); window.open("OVEM_AI营销系统.html#p0", "_blank"); toast("已打开前台站点"); return; }
  if(act === "reset"){
    if(confirm("恢复默认配置？当前所有改动与本地保存都会被清除。")){
      cfg = clone(DEFAULT_CFG);
      savedSnap = JSON.stringify(cfg);
      try{ localStorage.removeItem(LS_KEY); }catch(e){}
      renderView();
      toast("已恢复默认配置");
    }
    return;
  }
  if(act === "exportJS"){ saveCfg(true); download("ovem-config.js", buildJS(), "text/javascript;charset=utf-8"); toast("已导出 ovem-config.js"); return; }
  if(act === "exportJSON"){ download("ovem-config.json", JSON.stringify(cfg, null, 2), "application/json;charset=utf-8"); toast("已导出 config.json"); return; }
  if(act === "import"){ $("#importFile").click(); return; }
  if(act === "copySnippet"){ copyText('<script src="ovem-config.js"><\/script>', "引入代码已复制"); return; }
  if(act === "allOn" || act === "allOff"){
    cfg.products.forEach(p=>{ p.enabled = act === "allOn"; });
    syncCounts();
    renderView(); return;
  }
  if(act === "syncCounts"){
    syncCounts();
    renderView(); toast("封面计数已同步"); return;
  }
}

$("#viewRoot").addEventListener("input", e=>{
  const t = e.target;
  const num = v=>v === "" ? 0 : Number(v);

  if(t.dataset.pid && t.dataset.pfield){
    const p = cfg.products.find(x=>x.id === t.dataset.pid);
    if(!p) return;
    const f = t.dataset.pfield;
    p[f] = f === "enabled" ? t.checked : t.value;
    if(f === "enabled"){
      const row = t.closest(".prow");
      if(row) row.classList.toggle("is-off", !t.checked);
      syncCounts();
      renderNav();
    }
    onChange(); return;
  }

  if(t.dataset.ci !== undefined && t.dataset.cfield){
    const ch = cfg.channels[Number(t.dataset.ci)];
    if(!ch) return;
    const f = t.dataset.cfield;
    if(f === "name" && !ch.origName) ch.origName = ch.name;
    ch[f] = f === "enabled" ? t.checked : (f === "count" ? num(t.value) : t.value);
    if(f === "enabled"){
      const card = t.closest(".chcard");
      if(card) card.classList.toggle("is-off", !t.checked);
      syncCounts();
      renderNav();
    }
    onChange(); return;
  }

  if(t.dataset.page){
    cfg.pages[t.dataset.page] = t.checked;
    renderNav(); onChange(); return;
  }

  if(t.dataset.metric !== undefined && t.dataset.field){
    const m = cfg.metrics[Number(t.dataset.metric)];
    if(m){ m.v = num(t.value); onChange(); }
    return;
  }

  if(t.dataset.sec && t.dataset.field){
    const sec = t.dataset.sec, f = t.dataset.field, val = t.type === "number" ? num(t.value) : t.value;
    if(sec === "brand" || sec === "hero" || sec === "meta" || sec === "goals"){
      if(f.indexOf("roles.") === 0){
        const idx = Number(f.split(".")[1]);
        if(idx >= 0 && idx < 3) cfg.hero.roles[idx] = val;
      } else {
        cfg[sec][f] = val;
      }
      onChange();
    }
  }
});

$("#importFile").addEventListener("change", e=>{
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const patch = JSON.parse(reader.result);
      cfg = mergeCfg(cfg, patch);
      savedSnap = "";
      renderView();
      toast("配置已导入，保存后生效");
    }catch(err){ toast("导入失败：不是有效的配置文件"); }
  };
  reader.readAsText(file, "utf-8");
  e.target.value = "";
});

$("#btnSave").addEventListener("click", ()=>saveCfg());
$("#btnOpen").addEventListener("click", ()=>doAction("open"));
$("#btnReset").addEventListener("click", ()=>doAction("reset"));

document.addEventListener("keydown", e=>{
  if((e.ctrlKey || e.metaKey) && e.key === "s"){ e.preventDefault(); saveCfg(); }
});

/* 初始化 */
(function(){
  const proto = location.protocol;
  const t = $("#envText");
  if(t) t.textContent = proto === "file:" ? "本地演示环境 · file://" : (proto === "https:" ? "线上部署环境 · https" : "本地服务环境 · http");
})();
const __saveCfg = saveCfg;
saveCfg = function(silent){
  if(!enabledProducts().length || !enabledChannels().length){
    toast("至少保留 1 款启用产品与 1 个启用渠道，前台才能正常展示");
    return;
  }
  __saveCfg(silent);
};
renderView();

</script>
