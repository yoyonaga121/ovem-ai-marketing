<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OVEM 配置中台 v2.0</title>
<style>
:root{
  --brand:#1E3A8A; --brand-2:#2563EB; --brand-3:#EFF4FF;
  --ink:#0F172A; --ink-2:#334155; --muted:#64748B; --muted-2:#94A3B8;
  --line:#E2E8F0; --line-2:#EEF2F7; --bg:#F5F7FA; --card:#FFFFFF;
  --ok:#047857; --ok-bg:#ECFDF5; --warn:#B45309; --warn-bg:#FFFBEB;
  --err:#B91C1C; --err-bg:#FEF2F2;
  --r:8px; --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.65 "PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}

/* 侧栏 */
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line)}
.brandbox{display:flex;gap:10px;align-items:center;padding:18px 16px 14px}
.mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(140deg,#1E3A8A,#2563EB);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;letter-spacing:.06em}
.bname{font-size:13px;font-weight:700;letter-spacing:.04em}
.bsub{font-size:10.5px;color:var(--muted-2)}
.nav{flex:1;overflow:auto;padding:6px 10px 12px}
.ngroup{margin-top:10px}
.nglabel{font-size:10.5px;color:var(--muted-2);letter-spacing:.12em;padding:6px 8px 4px}
.nitem{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:0;background:none;border-radius:7px;cursor:pointer;color:var(--ink-2);font-size:12.5px;text-align:left}
.nitem:hover{background:var(--line-2)}
.nitem.on{background:var(--brand-3);color:var(--brand);font-weight:600}
.nicon{width:18px;height:18px;display:grid;place-items:center;font-size:11px;color:var(--muted);border-radius:4px;background:#F1F5F9}
.nitem.on .nicon{background:#fff;color:var(--brand-2)}
.nitem span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nbadge{font-size:10px;color:var(--muted-2);font-variant-numeric:tabular-nums}
.nbadge.warn{color:var(--warn)}
.sidefoot{padding:10px 16px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted-2);line-height:1.7}
.sidefoot b{color:var(--ink-2);font-weight:600}

/* 顶栏 */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:11px 22px;background:rgba(245,247,250,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.crumb{font-size:12px;color:var(--muted)}
.crumb b{color:var(--ink);font-weight:600}
.badges{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:6px;font-size:11px;background:#fff;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-bg);border-color:#CDEDDC;color:var(--ok)}
.chip.warn{background:var(--warn-bg);border-color:#FDE68A;color:var(--warn)}
.chip.err{background:var(--err-bg);border-color:#FECACA;color:var(--err)}
.chip.dirty{background:#EFF6FF;border-color:#BFDBFE;color:var(--brand-2)}
.btn{height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink-2);font-size:12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#CBD5E1;background:#FCFDFF}
.btn.primary{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.btn.primary:hover{background:#1D4ED8}
.btn.ghost{background:transparent}
.btn.danger{color:var(--err);border-color:#FECACA}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{height:26px;padding:0 9px;font-size:11px}

/* 内容 */
.content{padding:20px 22px 60px;max-width:1500px}
.shead{display:flex;align-items:flex-end;gap:16px;margin-bottom:14px}
.shead h1{margin:0;font-size:19px;letter-spacing:-.01em}
.shead p{margin:3px 0 0;font-size:12px;color:var(--muted);max-width:760px;line-height:1.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.card-h h3{margin:0;font-size:13.5px;font-weight:600}
.card-h p{margin:2px 0 0;font-size:11px;color:var(--muted)}
.card-h .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.card-b{padding:14px 16px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;box-shadow:var(--shadow)}
.stat .k{font-size:11px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .v small{font-size:11px;color:var(--muted-2);font-weight:400;margin-left:2px}
.stat .f{font-size:10.5px;color:var(--muted-2);margin-top:3px}

/* 表单 */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field{min-width:0}
.field.wide{grid-column:1/-1}
.field label{display:block;font-size:11.5px;color:var(--ink-2);margin-bottom:4px;font-weight:500}
.field label b{color:var(--err);font-weight:400;margin-left:2px}
input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font:12.5px/1.5 inherit;padding:6px 9px;min-width:0}
input[type=text],input[type=number],select{height:30px}
textarea{resize:vertical;padding:7px 9px}
input:focus,textarea:focus,select:focus{outline:none;border-color:#93B4F7;box-shadow:0 0 0 3px rgba(37,99,235,.10)}
input:disabled{background:#F8FAFC;color:var(--muted)}
.sub{font-size:10.5px;color:var(--muted-2);margin-top:3px}
.cons{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.cons span{font-size:9.5px;padding:1px 5px;border-radius:3px;background:#F1F5F9;color:var(--muted);white-space:nowrap}
.ferr{font-size:10.5px;color:var(--err);margin-top:3px;display:none}
.ferr.on{display:block}
.sw{position:relative;width:34px;height:18px;flex:none;display:inline-block}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;background:#CBD5E1;border-radius:20px;transition:.18s}
.sw i:after{content:"";position:absolute;width:14px;height:14px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked + i{background:var(--brand-2)}
.sw input:checked + i:after{transform:translateX(16px)}

/* 产品卡 */
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:180px;max-width:320px}
.search input{padding-left:26px}
.search:before{content:"⌕";position:absolute;left:9px;top:6px;color:var(--muted-2);font-size:13px}
.pcard{border:1px solid var(--line);border-radius:7px;margin-bottom:8px;background:#fff;overflow:hidden}
.pcard.off{opacity:.62}
.phead{display:flex;align-items:center;gap:9px;padding:8px 11px;cursor:pointer}
.phead:hover{background:#FAFBFD}
.twist{width:18px;height:18px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:11px;transition:transform .16s;flex:none}
.pcard.open .twist{transform:rotate(90deg)}
.pno{font-size:10.5px;color:var(--muted-2);font-variant-numeric:tabular-nums;width:26px;flex:none}
.pname{flex:1;min-width:0;font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{font-size:10.5px;color:var(--muted);flex:none}
.pill{font-size:9.5px;padding:1px 6px;border-radius:3px;flex:none;white-space:nowrap}
.pill.t1{background:#ECFEFF;color:#0E7490}
.pill.t2{background:#EFF6FF;color:#1D4ED8}
.pill.t3{background:#FFFBEB;color:#92400E}
.piss{width:16px;height:16px;border-radius:50%;background:var(--err-bg);color:var(--err);font-size:10px;display:none;place-items:center;flex:none;font-weight:600}
.pcard.haserr .piss{display:grid}
.pbody{padding:2px 12px 14px;border-top:1px solid var(--line-2)}
.pgroup{margin-top:11px}
.pgroup .glabel{font-size:10px;color:var(--muted-2);letter-spacing:.08em;margin-bottom:6px}

/* 渠道卡 */
.ccard{border:1px solid var(--line);border-radius:7px;margin-bottom:8px;background:#fff}
.ccard.off{opacity:.62}
.chead{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line-2)}
.cname{font-size:12.5px;font-weight:600}
.csizes{font-size:10.5px;color:var(--muted)}

/* 页面表 */
.ptable{width:100%;border-collapse:collapse}
.ptable th,.ptable td{padding:8px 10px;border-bottom:1px solid var(--line-2);text-align:left;font-size:12px}
.ptable th{font-size:10.5px;color:var(--muted);font-weight:500;background:#FAFBFD}
.ptable td.desc{color:var(--muted);font-size:11px}
.ptable tr:last-child td{border-bottom:0}

/* 列表 */
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line-2);font-size:12px}
.row:last-child{border-bottom:0}
.row .lbl{flex:1;min-width:0;color:var(--ink-2)}
.row .lbl small{display:block;color:var(--muted-2);font-size:10px}
.row .vals{flex:none;max-width:48%;text-align:right;font-size:11px;color:var(--muted);word-break:break-all}
.row .vals s{color:var(--muted-2)}
.row .vals b{color:var(--brand-2);font-weight:600}
.checks{display:flex;flex-direction:column;gap:7px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:12px}
.dot{width:14px;height:14px;border-radius:50%;display:grid;place-items:center;font-size:9px;flex:none;margin-top:2px}
.dot.ok{background:var(--ok-bg);color:var(--ok)}
.dot.warn{background:var(--warn-bg);color:var(--warn)}
.dot.err{background:var(--err-bg);color:var(--err)}
.check .t{flex:1}
.check .t small{display:block;color:var(--muted-2);font-size:10.5px}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:12px;border:1px dashed var(--line);border-radius:7px;background:#FCFDFF}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quick button{text-align:left;padding:10px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer}
.quick button:hover{border-color:#BFDBFE;background:#FCFDFF}
.quick b{display:block;font-size:12px;margin-bottom:2px}
.quick span{font-size:10.5px;color:var(--muted)}

/* 弹窗 / toast */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.42);display:grid;place-items:center;z-index:1000;padding:20px}
.modal{width:min(520px,94vw);background:#fff;border-radius:10px;box-shadow:0 24px 60px rgba(15,23,42,.28);overflow:hidden}
.modal h3{margin:0;padding:14px 16px;font-size:13.5px;border-bottom:1px solid var(--line-2)}
.m-body{padding:16px;max-height:60vh;overflow:auto;font-size:12.5px;line-height:1.8}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line-2);background:#FBFCFE}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);background:#0F172A;color:#fff;font-size:12px;padding:8px 14px;border-radius:7px;opacity:0;pointer-events:none;transition:.2s;z-index:1200}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1100px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .nav{display:flex;gap:6px;overflow-x:auto;padding:8px}
  .ngroup{margin:0;display:flex;gap:4px;align-items:center}
  .nglabel{display:none}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  .grid2,.grid3{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .content{padding:14px}
  .top{flex-wrap:wrap;padding:9px 14px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brandbox">
      <div class="mark">OV</div>
      <div>
        <div class="bname">OVEM 配置中台</div>
        <div class="bsub">Config Console · v2.0</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">
      <b>数据源</b> data/ovem-data.js<br>
      前台与后台共用同一份数据<br>
      <b>Ctrl+S</b> 存草稿
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="crumb" id="crumb">配置 / <b>概览</b></div>
      <div class="badges" id="badges"></div>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="data/ovem-data.js"></script>
<script src="data/ovem-schema.js"></script>
<script>
/* ============================================================
   OVEM 配置中台 v2.0
   ------------------------------------------------------------
   与 v1 的区别：
   1. 表单由 data/ovem-schema.js 驱动，字段增删不改后台代码
   2. 改的是完整数据对象（产品 13 字段），不再「只管 7 个字段」
   3. 有校验、有逐字段 diff、有影响面、有快照与回滚、有变更日志
   4. 草稿与发布分离：草稿供前台本地预览，发布导出数据文件
   ============================================================ */
const LS = { draft:"ovem_data_draft", snap:"ovem_snapshots_v2", exp:"ovem_last_export" };
const S = window.OVEM_SCHEMA;
const FILE_DATA = window.OVEM_DATA;

let BASE = FILE_DATA ? clone(FILE_DATA) : null;   /* 已发布基线 */
let draft = FILE_DATA ? loadDraft() : null;       /* 工作副本 */
let view = "dashboard";
let q = "";
const opened = {};
let ISSUE_CACHE = null;

/* 启动放到脚本末尾：避免 const（NAV / HEAD）在初始化前被访问 */

function fatal(){
  document.getElementById("content").innerHTML =
    '<div class="empty" style="margin-top:40px">'
    + '<h2 style="font-size:15px;color:#1E3A8A;margin:0 0 8px">数据源未加载</h2>'
    + '<p style="margin:0">本后台需要 <code>data/ovem-data.js</code> 与 <code>data/ovem-schema.js</code>，<br>'
    + '请确认两个文件与 <code>OVEM配置后台.html</code> 在同一目录下。</p></div>';
}

/* ---------------- 工具 ---------------- */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function $(s){ return document.querySelector(s); }
function el(id){ return document.getElementById(id); }
function eq(a,b){ return JSON.stringify(a) === JSON.stringify(b); }
function getPath(obj, path){
  return path.split(".").reduce((o,k)=> (o == null ? undefined : o[k]), obj);
}
function setPath(obj, path, val){
  const ks = path.split(".");
  let o = obj;
  for(let i = 0; i < ks.length - 1; i++){
    const k = ks[i];
    if(o[k] == null) o[k] = /^\d+$/.test(ks[i+1]) ? [] : {};
    o = o[k];
  }
  o[ks[ks.length-1]] = val;
}
function nowStr(){
  const d = new Date(), p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate())
       + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function toast(msg){
  const t = el("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove("on"), 2200);
}
function section(id){ return S.sections.find(s => s.id === id); }
function fmt(v){
  if(v === true) return "开";
  if(v === false) return "关";
  if(Array.isArray(v)) return v.join("、") || "（空）";
  if(v === undefined || v === null || v === "") return "（空）";
  return String(v);
}

/* ---------------- 草稿 ---------------- */
function loadDraft(){
  try{
    const raw = localStorage.getItem(LS.draft);
    if(raw){
      const pack = JSON.parse(raw);
      if(pack && pack.data && pack.meta && pack.meta.mode === "draft") return pack.data;
    }
  }catch(e){}
  return clone(FILE_DATA);
}
function saveDraft(silent){
  const pack = {
    meta: { mode:"draft", version:(draft.meta && draft.meta.version) || "draft", updated: nowStr() },
    data: draft
  };
  try{
    localStorage.setItem(LS.draft, JSON.stringify(pack));
    if(!silent) toast("草稿已保存到本机，前台刷新即可预览");
    refreshBadges();
  }catch(e){
    toast("保存失败：浏览器存储已满或被禁用");
  }
}
function clearDraft(){
  localStorage.removeItem(LS.draft);
  draft = clone(BASE);
  toast("草稿已清除，回到已发布版本");
  render();
}

/* ---------------- 校验 ---------------- */
function checkField(f, v){
  if(f.required && (v === undefined || v === null || String(v).trim() === "" || (Array.isArray(v) && !v.length))) return "必填";
  if(v === undefined || v === null) return "";
  if(f.type === "switch") return "";
  if(f.type === "tags"){
    const n = Array.isArray(v) ? v.filter(Boolean).length : 0;
    if(f.maxItems && n > f.maxItems) return "最多 " + f.maxItems + " 项（当前 " + n + "）";
    if(f.minItems && n < f.minItems) return "至少 " + f.minItems + " 项（当前 " + n + "）";
    return "";
  }
  if(f.type === "number"){
    if(String(v).trim() === "") return "";
    const n = Number(v);
    if(!isFinite(n)) return "必须是数字";
    if(f.min !== undefined && n < f.min) return "不能小于 " + f.min;
    if(f.max !== undefined && n > f.max) return "不能大于 " + f.max;
    return "";
  }
  const s = String(v);
  if(f.max && s.length > f.max) return "超出 " + f.max + " 字（当前 " + s.length + "）";
  if(f.pattern && !new RegExp(f.pattern).test(s)) return "格式不符，示例 4,999";
  if(f.options && !f.options.some(o => o.v === v)) return "不在可选范围内";
  return "";
}

function validate(data){
  const issues = [];
  S.sections.forEach(sec => {
    const t = sec.target;
    if(sec.type === "object"){
      (sec.fields || []).forEach(f => {
        const msg = checkField(f, data[t] ? data[t][f.key] : undefined);
        if(msg) issues.push({ level:"error", path:t+"."+f.key, msg: sec.title + " · " + f.label + "：" + msg });
      });
    }
    if(sec.type === "array"){
      const arr = data[t] || [];
      (sec.itemFields || []).forEach(f => {
        if(!f.unique) return;
        const seen = {};
        arr.forEach((it, i) => {
          const k = String(it[f.key]);
          if(!k || k === "undefined") return;
          if(seen[k]) issues.push({ level:"error", path:t+"."+i+"."+f.key, msg: f.label + " 重复：" + k });
          seen[k] = true;
        });
      });
      arr.forEach((it, i) => {
        (sec.itemFields || []).forEach(f => {
          const msg = checkField(f, it[f.key]);
          if(msg) issues.push({ level:"error", path:t+"."+i+"."+f.key, msg: itemName(sec, it, i) + " · " + f.label + "：" + msg });
        });
      });
    }
  });
  (S.rules || []).forEach(r => {
    let ok = true;
    try{ ok = r.test(data); }catch(e){ ok = true; }
    if(!ok) issues.push({ level: r.level || "error", path:"rule:" + r.id, msg: r.msg });
  });
  return issues;
}
function allIssues(){
  if(!ISSUE_CACHE) ISSUE_CACHE = validate(draft);
  return ISSUE_CACHE;
}
function errorsOnly(list){ return list.filter(x => x.level === "error"); }
function issuesFor(list, prefix){ return list.filter(x => x.path.indexOf(prefix) === 0); }

function itemName(sec, item, i){
  if(sec.id === "products") return "P" + String(item.no || i+1).padStart(2,"0") + " " + (item.short || item.name || "");
  if(sec.id === "channels") return item.name || ("渠道 " + (i+1));
  if(sec.id === "metrics") return item.label || ("指标 " + (i+1));
  return sec.title + " #" + (i+1);
}

/* ---------------- diff ---------------- */
function computeDiff(){
  const rows = [];
  S.sections.forEach(sec => {
    const t = sec.target;
    if(sec.type === "object"){
      (sec.fields || []).forEach(f => {
        const a = BASE[t] ? BASE[t][f.key] : undefined;
        const b = draft[t] ? draft[t][f.key] : undefined;
        if(!eq(a,b)) rows.push({ path:t+"."+f.key, label:sec.title+" · "+f.label, before:a, after:b, consumers:f.consumers || [] });
      });
    }
    if(sec.type === "array"){
      const A = BASE[t] || [], B = draft[t] || [];
      const n = Math.max(A.length, B.length);
      for(let i = 0; i < n; i++){
        const ia = A[i] || {}, ib = B[i] || {};
        (sec.itemFields || []).forEach(f => {
          if(!eq(ia[f.key], ib[f.key])){
            rows.push({
              path: t+"."+i+"."+f.key,
              label: itemName(sec, ib, i) + " · " + f.label,
              before: ia[f.key], after: ib[f.key],
              consumers: f.consumers || []
            });
          }
        });
      }
    }
  });
  return rows;
}
function impactOf(rows){
  const pages = {};
  rows.forEach(r => {
    (r.consumers || []).forEach(c => {
      const m = String(c).match(/P\d+/);
      if(m) pages[m[0]] = (pages[m[0]] || 0) + 1;
    });
  });
  return { fields: rows.length, pages: Object.keys(pages).sort((a,b)=> (+a.slice(1)) - (+b.slice(1))), hits: pages };
}

/* ---------------- 推导 ---------------- */
function counts(){
  const pc = (draft.products || []).filter(p => p.enabled !== false).length;
  const cc = (draft.channels || []).filter(c => c.enabled !== false).length;
  return { pc, cc, slots: pc*cc, variants: pc*cc*3 };
}
function derived(m){
  const c = counts();
  switch(m.derive){
    case "products": return c.pc;
    case "channels": return c.cc;
    case "slots": return c.slots;
    case "variants": return c.variants;
    default: return m.v;
  }
}

function navBadge(id){
  if(id === "products"){
    const n = (draft.products || []).filter(p => p.enabled !== false).length;
    return { text: n + "/" + (draft.products || []).length };
  }
  if(id === "channels"){
    const n = (draft.channels || []).filter(c => c.enabled !== false).length;
    return { text: n + "/" + (draft.channels || []).length };
  }
  if(id === "pages"){
    const n = S.pages.filter(p => draft.pages[p.id] !== false).length;
    return { text: n + "/" + S.pages.length };
  }

    return d ? { text: d + " 改", warn: true } : null;
  }

/* ---------------- 顶栏状态 ---------------- */
function refreshBadges(){
  const diffs = computeDiff();
  const issues = allIssues();
  const errs = errorsOnly(issues);
  const wins = issues.filter(x => x.level !== "error");
  const imp = impactOf(diffs);
  const lastExp = localStorage.getItem(LS.exp);

  let html = "";
  if(diffs.length){
    html += '<span class="chip dirty">待发布 ' + diffs.length + " 项 · 影响 " + imp.pages.length + " 页</span>";
  }else if(lastExp){
    html += '<span class="chip warn">已导出 ' + esc(lastExp) + " · 待覆盖文件</span>";
  }else{
    html += '<span class="chip ok">与已发布版本一致</span>';
  }
  html += errs.length
    ? '<span class="chip err">' + errs.length + " 处校验错误</span>"
    : '<span class="chip ok">校验通过</span>';
  if(wins.length) html += '<span class="chip warn">' + wins.length + " 条提醒</span>";

  html += '<button class="btn sm" data-act="check">重新校验</button>';
  html += '<button class="btn sm" data-act="saveDraft">存草稿</button>';
  html += '<button class="btn sm primary" data-act="publish">发布</button>';
  el("badges").innerHTML = html;
  buildNav();
}

/* ---------------- 渲染 ---------------- */
function render(){
  ISSUE_CACHE = null;
  const meta = HEAD[view] || {};
  const sec = section(view);
  const title = meta.title || (sec ? sec.title : view);
  const desc = meta.desc || (sec ? sec.desc : "");
  el("crumb").innerHTML = esc(meta.crumb || "配置") + " / <b>" + esc(title) + "</b>";

  let body = "";
  if(view === "dashboard") body = vDashboard();
  else if(view === "publish") body = vPublish();
  else if(view === "history") body = vHistory();
  else if(view === "pages") body = vPages();
  else if(view === "products") body = vProducts(sec);
  else if(view === "channels") body = vChannels(sec);
  else if(view === "metrics") body = vMetrics(sec);
  else if(sec && sec.type === "object") body = vObject(sec);
  else body = '<div class="empty">该模块尚未实现</div>';

  el("content").innerHTML =
    '<div class="shead"><div><h1>' + esc(title) + "</h1>" + (desc ? "<p>" + esc(desc) + "</p>" : "") + "</div></div>" + body;
  refreshBadges();
}

    + stat("含变体", c.variants, "", "每个物料位 3 个 A/B")

  + '<div class="card"><div class="card-h"><div><h3>本次改动</h3><p>逐字段对比「已发布版本」，右侧是改动后的值。</p></div>'
    + '<div class="right"><button class="btn sm" data-nav="publish">查看全部 ' + diffs.length + " 项</button></div></div>"
    + '<div class="card-b">'

function stat(k, v, unit, foot){
  return '<div class="stat"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v)
    + (unit ? "<small>" + esc(unit) + "</small>" : "") + '</div><div class="f">' + esc(foot) + "</div></div>";
}
function countRequired(filledOnly){
  let n = 0;
  S.sections.forEach(sec => {
    const test = (f, v) => {
      if(!f.required) return;
      const empty = v === undefined || v === null || String(v).trim() === "" || (Array.isArray(v) && !v.length);
      if(empty) return;
      n++;
      return;
    };
    if(sec.type === "object") (sec.fields || []).forEach(f => test(f, draft[sec.target] ? draft[sec.target][f.key] : undefined));
    if(sec.type === "array") (draft[sec.target] || []).forEach(it => (sec.itemFields || []).forEach(f => test(f, it[f.key])));
  });
  if(!filledOnly){
    /* 总数：同一套遍历，只数不判断 */
    let total = 0;
    S.sections.forEach(sec => {
      if(sec.type === "object") (sec.fields || []).forEach(f => { if(f.required) total++; });
      if(sec.type === "array") (draft[sec.target] || []).forEach(() => (sec.itemFields || []).forEach(f => { if(f.required) total++; }));
    });
    return total;
  }
  return n;
}
function diffList(rows){
  return '<div class="rows">' + rows.map(r =>
    '<div class="row"><span class="lbl">' + esc(r.label) + "<small>" + esc((r.consumers||[]).join(" · ") || "无消费方") + "</small></span>"
    + '<span class="vals"><s>' + esc(fmt(r.before)) + "</s> → <b>" + esc(fmt(r.after)) + "</b></span></div>"
  ).join("") + "</div>";
}

/* ---------------- 字段控件 ---------------- */
function fieldHtml(f, val, path, showCons){
  const id = "f_" + path.replace(/[^\w]/g, "_");
  const label = '<label for="' + id + '">' + esc(f.label) + (f.required ? "<b>*</b>" : "") + "</label>";
  let ctl = "";
  switch(f.type){
    case "textarea":
      ctl = '<textarea id="' + id + '" data-path="' + path + '" rows="' + (f.rows || 3) + '">' + esc(val || "") + "</textarea>";
      break;
    case "number":
      ctl = '<input id="' + id + '" type="number" data-path="' + path + '" value="' + (val === undefined || val === null ? "" : esc(val)) + '"'
        + (f.min !== undefined ? ' min="' + f.min + '"' : "") + (f.max !== undefined ? ' max="' + f.max + '"' : "")
        + ' step="' + (f.step || 1) + '">';
      break;
    case "select":
      ctl = '<select id="' + id + '" data-path="' + path + '">'
        + (f.required ? "" : '<option value="">（未填）</option>')
        + (f.options || []).map(o => '<option value="' + esc(o.v) + '"' + (o.v === val ? " selected" : "") + ">" + esc(o.label) + "</option>").join("")
        + "</select>";
      break;
    case "switch":
      ctl = '<label class="sw"><input type="checkbox" data-path="' + path + '"' + (val === false ? "" : " checked") + '><i></i></label>';
      break;
    case "tags":
      ctl = '<input id="' + id + '" type="text" data-path="' + path + '" value="' + esc((val || []).join("、")) + '" placeholder="用顿号分隔">';
      break;
    default:
      ctl = '<input id="' + id + '" type="text" data-path="' + path + '" value="' + esc(val == null ? "" : val) + '">';
  }
  const hint = f.hint ? '<div class="sub">' + esc(f.hint) + "</div>" : "";
  const cons = showCons && (f.consumers || []).length
    ? '<div class="cons">' + f.consumers.map(c => "<span>" + esc(c) + "</span>").join("") + "</div>" : "";
  const err = allIssues().filter(x => x.path === path)[0];
  return '<div class="field' + (f.type === "textarea" ? " wide" : "") + '">' + label + ctl + hint + cons
    + '<div class="ferr' + (err ? " on" : "") + '">' + esc(err ? err.msg : "") + "</div></div>";
}

    + '<div class="card-b"><div class="toolbar">'

function productCard(sec, p){
  const idx = draft.products.indexOf(p);
  const open = !!opened[p.id];
  const bad = errorsOnly(allIssues()).filter(x => x.path.indexOf("products." + idx + ".") === 0).length;
  const tierCls = p.tier === "引流" ? "t1" : p.tier === "旗舰" ? "t3" : "t2";
  const fields = sec.itemFields.filter(f => f.key !== "enabled");
  const groupA = ["name","short","price"];
  const groupB = ["scene","tier","wave"];
  const groupC = ["oneliner","hook"];
  const groupD = ["tags"];
  const groupE = ["pain","diff","audience"];

  const render = (keys, cls) => '<div class="' + (cls || "grid3") + '">' + keys.map(k => {
    const f = fields.find(x => x.key === k);
    return f ? fieldHtml(f, p[k], "products." + idx + "." + k, false) : "";
  }).join("") + "</div>";

  return '<div class="pcard' + (open ? " open" : "") + (p.enabled === false ? " off" : "") + (bad ? " haserr" : "") + '" data-pid="' + esc(p.id) + '">'
    + '<div class="phead" data-toggle="' + esc(p.id) + '">'
      + '<button class="twist" type="button">▸</button>'
      + '<span class="pno">P' + String(p.no || idx+1).padStart(2,"0") + "</span>"
      + '<span class="pname">' + esc(p.short || p.name || "（未命名）")
        + '　<span style="color:#94A3B8;font-weight:400">' + esc(p.name || "") + "</span></span>"
      + '<span class="pmeta">¥' + esc(p.price || "-") + "</span>"
      + '<span class="pill ' + tierCls + '">' + esc(p.tier || "-") + "</span>"
      + '<span class="pill t2">' + esc(p.wave || "-") + "</span>"
      + '<span class="piss" title="' + bad + ' 处错误">!</span>'
      + '<label class="sw" title="启用 / 停用"><input type="checkbox" data-path="products.' + idx + '.enabled"' + (p.enabled === false ? "" : " checked") + '><i></i></label>'
    + "</div>"
    + (open ? '<div class="pbody">'
        + '<div class="pgroup"><div class="glabel">基本</div>' + render(groupA) + "</div>"
        + '<div class="pgroup"><div class="glabel">定位</div>' + render(groupB) + "</div>"
        + '<div class="pgroup"><div class="glabel">传播语言</div>' + render(groupC, "grid2") + "</div>"
        + '<div class="pgroup"><div class="glabel">能力标签（固定 3 个）</div>' + render(groupD, "grid2") + "</div>"
        + '<div class="pgroup"><div class="glabel">三层信息（P4 直接引用）</div>' + render(groupE) + "</div>"
      + "</div>" : "")
    + "</div>";
}
function matchQ(p){
  if(!q) return true;
  const s = (p.name + " " + p.short + " P" + p.no + " " + p.id + " " + p.oneliner).toLowerCase();
  return s.indexOf(q.toLowerCase()) >= 0;
}

function channelCard(sec, c, i){
  const fields = sec.itemFields;
  const cell = k => {
    const f = fields.find(x => x.key === k);
    return f ? fieldHtml(f, c[k], "channels." + i + "." + k, false) : "";
  };
  return '<div class="ccard' + (c.enabled === false ? " off" : "") + '">'
    + '<div class="chead">'
      + '<label class="sw"><input type="checkbox" data-path="channels.' + i + '.enabled"' + (c.enabled === false ? "" : " checked") + '><i></i></label>'
      + '<span class="cname">' + esc(c.name) + "</span>"
      + '<span class="csizes">' + esc(c.size || "") + "</span>"
      + '<span class="pmeta" style="margin-left:auto">' + esc(c.count) + " 条 · " + esc(c.kpi || "") + "</span>"
    + "</div>"
    + '<div class="card-b"><div class="grid3">'
      + cell("name") + cell("img") + cell("caption")
      + cell("size") + cell("count") + cell("kpi")
      + cell("cycle") + cell("tpl") + cell("rule")
    + "</div></div></div>";
}

/* ---------------- 封面指标 ---------------- */
function vMetrics(sec){
  const c = counts();
  const rows = (draft.metrics || []).map((m, i) =>
    '<div class="grid3" style="padding:10px 0;border-bottom:1px dashed #EEF2F7">'
      + fieldHtml(sec.itemFields[0], m.label, "metrics." + i + ".label", false)
      + '<div class="field"><label>数值</label><input type="number" data-path="metrics.' + i + '.v" value="' + esc(derived(m)) + '"'
        + (m.derive ? ' disabled title="由推导来源自动计算"' : "") + ">"
        + (m.derive ? '<div class="sub">自动推导 ' + esc(m.derive) + " → " + esc(derived(m)) + "</div>" : '<div class="sub">手工填写</div>')
      + "</div>"
      + fieldHtml(sec.itemFields[2], m.unit, "metrics." + i + ".unit", false)
    + "</div>"
    + '<div style="margin:-2px 0 12px">' + fieldHtml(sec.itemFields[3], m.derive, "metrics." + i + ".derive", false) + "</div>"
  ).join("");

  return '<div class="card"><div class="card-h"><div><h3>封面五项指标</h3>'
    + "<p>P0 底部数据条。带推导来源的指标按当前启用数量实时计算，改产品不必回来手改数字。</p></div>"
    + '<div class="right"><button class="btn sm" data-act="syncMetrics">按当前计数重算并写回</button></div></div>'
    + '<div class="card-b"><div class="stats" style="grid-template-columns:repeat(4,1fr);margin-bottom:14px">'
      + stat("启用产品", c.pc, "", "用于「已定义 SKU」")
      + stat("启用渠道", c.cc, "", "用于「内容渠道」")
      + stat("物料位", c.slots, "", "产品 × 渠道")
      + stat("含变体", c.variants, "", "物料位 × 3")
    + "</div>" + rows + "</div></div>";
}

/* ---------------- 页面与导航 ---------------- */
function vPages(){
  return '<div class="card"><div class="card-h"><div><h3>页面可见性</h3>'
    + "<p>关掉的页面会同时从侧栏导航移除，并从 DOM 里删掉对应 section，避免「只藏入口、内容仍可被搜到」。</p></div>"
    + '<div class="right"><span class="chip">' + S.pages.filter(p=>draft.pages[p.id]!==false).length + " / " + S.pages.length + " 可见</span></div></div>"
    + '<div class="card-b"><table class="ptable"><thead><tr>'
      + '<th style="width:56px">编号</th><th style="width:150px">页面</th><th>内容</th><th style="width:70px">可见</th></tr></thead><tbody>'
    + S.pages.map(p => '<tr><td>' + p.no + "</td><td>" + esc(p.name) + '</td><td class="desc">' + esc(p.desc) + "</td>"
        + '<td><label class="sw"><input type="checkbox" data-path="pages.' + p.id + '"' + (draft.pages[p.id] === false ? "" : " checked") + '><i></i></label></td></tr>').join("")
    + "</tbody></table></div></div>";
}

/* ---------------- 版本与快照 ---------------- */
function snapshots(){
  try{ return JSON.parse(localStorage.getItem(LS.snap) || "[]"); }catch(e){ return []; }
}
function saveSnapshots(list){
  try{ localStorage.setItem(LS.snap, JSON.stringify(list.slice(0, 20))); }
  catch(e){ toast("快照保存失败：浏览器存储已满"); }
}
function vHistory(){
  const list = snapshots();
  return '<div class="card"><div class="card-h"><div><h3>本地快照</h3>'
    + "<p>手动存档点，最多保留 20 份。恢复前会自动把当前状态再存一份，防止误操作。</p></div>"
    + '<div class="right"><button class="btn sm primary" data-act="snap">存一份快照</button></div></div>'
    + '<div class="card-b">' + (list.length
      ? '<div class="rows">' + list.map((s, i) =>
          '<div class="row"><span class="lbl"><b style="color:#0F172A">' + esc(s.version || "未命名") + "</b> · " + esc(s.note || "无说明")
            + "<small>" + esc(s.at) + " · 存于 " + esc(s.rows || 0) + " 条改动时</small></span>"
            + '<span class="vals"><button class="btn sm" data-act="restore" data-i="' + i + '">恢复</button> '
            + '<button class="btn sm danger" data-act="delSnap" data-i="' + i + '">删除</button></span></div>'
          ).join("") + "</div>"
      : '<div class="empty">还没有快照。建议在每次发布前存一份。</div>')
    + "</div></div>"

    + '<div class="card"><div class="card-h"><div><h3>变更日志</h3><p>发布时自动追加，跟数据文件一起走，方便回溯。</p></div></div>'
    + '<div class="card-b"><div class="rows">' + ((draft.meta && draft.meta.changelog) || []).map(x =>
        '<div class="row"><span class="lbl"><b style="color:#0F172A">' + esc(x.v) + "</b> · " + esc(x.note || "")
          + "<small>" + esc(x.at || "") + " · " + esc(x.by || "—") + "</small></span></div>"
      ).join("") + "</div></div></div>";
}

/* ---------------- 发布 ---------------- */
function vPublish(){
  const diffs = computeDiff();
  const issues = allIssues();
  const errs = errorsOnly(issues);
  const imp = impactOf(diffs);
  const last = localStorage.getItem(LS.exp) || "尚未导出";
  const hasDraft = !!localStorage.getItem(LS.draft);

  return '<div class="stats" style="grid-template-columns:repeat(4,1fr)">'
    + stat("待发布改动", diffs.length, "项", imp.pages.length + " 个页面受影响")
    + stat("校验错误", errs.length, "处", errs.length ? "修复后才能发布" : "可以发布")
    + stat("当前版本", (draft.meta && draft.meta.version) || "—", "", "上次导出：" + last)
    + stat("草稿状态", hasDraft ? "已存" : "无", "", hasDraft ? "前台刷新可见" : "前台读文件数据")
  + "</div>"

  + '<div class="card"><div class="card-h"><div><h3>发布前检查</h3><p>错误会阻止导出；提醒不阻止，但建议确认。</p></div></div><div class="card-b">'
    + (issues.length
      ? '<div class="checks">' + issues.map(x =>
          '<div class="check"><span class="dot ' + (x.level === "error" ? "err" : "warn") + '">' + (x.level === "error" ? "✕" : "!") + "</span>"
          + '<span class="t">' + esc(x.msg) + "</span></div>").join("") + "</div>"
      : '<div class="checks"><div class="check"><span class="dot ok">✓</span><span class="t">全部检查通过，可以发布</span></div></div>')
    + "</div></div>"

  + '<div class="card"><div class="card-h"><div><h3>本次改动 · 影响面</h3><p>发布后会同时改变这些页面。</p></div></div><div class="card-b">'
    + (diffs.length
      ? '<div style="margin-bottom:10px">' + imp.pages.map(pid => {
          const p = S.pages.find(x => x.id === pid) || { no:pid, name:pid };
          return '<span class="chip" style="margin:0 4px 4px 0">' + p.no + " " + esc(p.name) + "</span>";
        }).join("") + "</div>"
        + '<div class="rows">' + diffs.map(r =>
          '<div class="row"><span class="lbl">' + esc(r.label) + "<small>" + esc((r.consumers||[]).join(" · ")) + "</small></span>"
          + '<span class="vals"><s>' + esc(fmt(r.before)) + "</s> → <b>" + esc(fmt(r.after)) + "</b></span></div>").join("") + "</div>"
      : '<div class="empty">没有待发布改动。可以先在配置页改点什么。</div>')
    + "</div></div>"

  + '<div class="card"><div class="card-h"><div><h3>发布动作</h3><p>草稿用于自己预览，发布包用于上线。</p></div></div><div class="card-b">'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
      + '<button class="btn primary" data-act="publish"' + (errs.length ? " disabled" : "") + ">发布并导出 ovem-data.js</button>"
      + '<button class="btn" data-act="saveDraft">保存草稿（前台本地预览）</button>'
      + '<button class="btn" data-act="exportJson">导出 JSON 备份</button>'
      + '<button class="btn ghost" data-act="clearDraft">清除草稿</button>'
      + '<button class="btn ghost" data-act="openFront">打开前台</button>'
    + "</div>"
    + '<div class="sub" style="margin-top:12px;line-height:1.95">'
      + "① 导出后得到 <code>ovem-data.js</code>，覆盖站点 <code>data/</code> 下的同名文件；<br>"
      + "② 前台刷新即读新数据，顶栏会显示 <code>数据 vX.X.X</code>；<br>"
      + "③ 草稿只存在于本浏览器，换设备或清缓存即失效，不要拿草稿当发布。"
    + "</div></div></div>";
}

/* ---------------- 导出 ---------------- */
function dataFileText(data){
  const stamp = new Date().toISOString();
  return "/* ============================================================\n"
    + "   OVEM 单一数据源 · 由配置中台 v2.0 发布\n"
    + "   发布时间：" + stamp + "\n"
    + "   版本：" + ((data.meta && data.meta.version) || "") + "\n"
    + "   前台 index.html 与本后台共用此文件，请勿在别处重复定义同类字段\n"
    + "   ============================================================ */\n"
    + "window.OVEM_DATA = " + JSON.stringify(data, null, 2) + ";\n";
}
function download(name, text, mime){
  const blob = new Blob([text], { type: (mime || "text/javascript") + ";charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

/* ---------------- 弹窗 ---------------- */
function modal(title, body, onOk, okText){
  const mask = document.createElement("div");
  mask.className = "mask";
  mask.innerHTML = '<div class="modal"><h3>' + esc(title) + '</h3><div class="m-body">' + body + "</div>"
    + '<div class="m-foot"><button class="btn ghost" data-m="cancel">取消</button>'
    + '<button class="btn primary" data-m="ok">' + esc(okText || "确认") + "</button></div></div>";
  document.body.appendChild(mask);
  mask.addEventListener("click", e => {
    const b = e.target.closest("[data-m]");
    if(b && b.dataset.m === "cancel"){ mask.remove(); return; }
    if(b && b.dataset.m === "ok"){
      if(onOk && onOk(mask) === false) return;
      mask.remove();
    }
    if(e.target === mask) mask.remove();
  });
  return mask;
}

/* ---------------- 事件 ---------------- */
let badgeTimer = null;
function scheduleBadges(){
  clearTimeout(badgeTimer);
  badgeTimer = setTimeout(refreshBadges, 220);
}

document.addEventListener("input", e => {
  const t = e.target;
  if(t.id === "q"){
    q = t.value;
    const pos = t.selectionStart;
    render();
    const nq = el("q");
    if(nq){ nq.focus(); nq.setSelectionRange(pos, pos); }
    return;
  }
  if(!t.dataset || !t.dataset.path) return;
  writeField(t);
  const errBox = t.closest(".field") && t.closest(".field").querySelector(".ferr");
  if(errBox){
    const msg = allIssues().filter(x => x.path === t.dataset.path)[0];
    errBox.textContent = msg ? msg.msg : "";
    errBox.classList.toggle("on", !!msg);
  }
  scheduleBadges();
});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.dataset && t.dataset.path){ writeField(t); refreshBadges(); }
});

function writeField(t){
  const path = t.dataset.path;
  let v;
  if(t.type === "checkbox") v = t.checked;
  else if(t.type === "number") v = t.value === "" ? "" : Number(t.value);
  else if(path.indexOf("tags") >= 0) v = t.value.split(/[、,，\s]+/).filter(Boolean);
  else v = t.value;
  setPath(draft, path, v);
  ISSUE_CACHE = null;
}

document.addEventListener("click", e => {
  const nav = e.target.closest("[data-nav]");
  if(nav){ view = nav.dataset.nav; render(); return; }

  const tog = e.target.closest("[data-toggle]");
  if(tog && !e.target.closest(".sw")){
    const id = tog.dataset.toggle;
    opened[id] = !opened[id];
    render();
    return;
  }

  const act = e.target.closest("[data-act]");
  if(act){ doAction(act.dataset.act, act); return; }
});

function doAction(act, node){
  if(act === "check"){
    ISSUE_CACHE = null;
    const e = errorsOnly(allIssues()).length;
    toast(e ? "校验发现 " + e + " 处错误" : "校验通过，没有错误");
    render();
  }
  if(act === "saveDraft"){ saveDraft(); render(); }
  if(act === "clearDraft"){
    modal("清除草稿", "<p>清除后前台会回到 <code>data/ovem-data.js</code> 的已发布数据。当前未导出的改动会丢失。</p>", ()=>clearDraft(), "确认清除");
  }
  if(act === "openFront"){ window.open("index.html", "_blank"); }
  if(act === "exportJson"){
    download("ovem-data." + ((draft.meta && draft.meta.version) || "backup") + ".json", JSON.stringify(draft, null, 2), "application/json");
    toast("已导出 JSON 备份");
  }
  if(act === "publish"){ publishFlow(); }
  if(act === "snap"){ snapshotFlow(); }
  if(act === "syncMetrics"){
    (draft.metrics || []).forEach(m => { if(m.derive) m.v = derived(m); });
    ISSUE_CACHE = null;
    toast("已按当前产品与渠道数量重算写回");
    render();
  }
  if(act === "expandAll"){ (draft.products||[]).forEach(p => opened[p.id] = true); render(); }
  if(act === "collapseAll"){ Object.keys(opened).forEach(k => delete opened[k]); render(); }
  if(act === "expandErr"){
    const issues = errorsOnly(allIssues());
    (draft.products||[]).forEach((p, i) => {
      if(issues.some(x => x.path.indexOf("products." + i + ".") === 0)) opened[p.id] = true;
    });
    render();
  }
  if(act === "restore"){
    const i = Number(node.dataset.i), s = snapshots()[i];
    if(!s) return;
    modal("恢复快照", "<p>将把当前工作副本替换为 <b>" + esc(s.version) + "</b>（" + esc(s.at) + "）。<br>"
      + "恢复前会自动把当前状态再存一份。</p>", ()=>{
      const list = snapshots();
      list.unshift({ at: nowStr(), version: (draft.meta&&draft.meta.version)||"自动备份", note:"恢复前自动备份", rows: computeDiff().length, data: clone(draft) });
      saveSnapshots(list);
      draft = clone(s.data);
      ISSUE_CACHE = null;
      toast("已恢复：" + s.version);
      render();
    }, "恢复");
  }
  if(act === "delSnap"){
    const i = Number(node.dataset.i), list = snapshots();
    list.splice(i, 1);
    saveSnapshots(list);
    render();
  }
}

function snapshotFlow(){
  modal("存一份快照",
    '<div class="field"><label>说明</label><input type="text" id="snapNote" placeholder="例如：二期渠道改版前"></div>',
    m => {
      const note = m.querySelector("#snapNote").value.trim();
      const list = snapshots();
      list.unshift({
        at: nowStr(),
        version: (draft.meta && draft.meta.version) || "未命名",
        note: note || "手动快照",
        rows: computeDiff().length,
        data: clone(draft)
      });
      saveSnapshots(list);
      toast("快照已保存");
      render();
    }, "保存");
}

function publishFlow(){
  const errs = errorsOnly(allIssues());
  if(errs.length){
    modal("无法发布", "<p>还有 <b>" + errs.length + "</b> 处错误：</p><ul style='padding-left:18px;margin:8px 0'>"
      + errs.slice(0,6).map(x => "<li>" + esc(x.msg) + "</li>").join("") + "</ul>"
      + "<p style='color:#64748B;margin:0'>修完再点发布。</p>", null, "知道了");
    return;
  }
  const diffs = computeDiff();
  if(!diffs.length){ toast("没有改动可发布"); return; }
  const imp = impactOf(diffs);

  modal("发布确认",
    '<div class="field"><label>版本号</label><input type="text" id="pubVer" value="'
      + esc((draft.meta && draft.meta.version) || "v2.0.1") + '"></div>'
    + '<div class="field" style="margin-top:10px"><label>变更说明（写入变更日志）</label>'
    + '<input type="text" id="pubNote" placeholder="例如：P3 增加收纳场景缺口提示"></div>'
    + '<div style="margin-top:14px;padding:10px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:7px">'
    + "<b>" + diffs.length + "</b> 项改动 · 影响 <b>" + imp.pages.length + "</b> 个页面（"
    + (imp.pages.join(" / ") || "—") + "）<br>"
    + '<span style="color:#64748B;font-size:11px">导出后请覆盖 data/ovem-data.js，前台刷新生效。</span></div>',
    m => {
      const ver = m.querySelector("#pubVer").value.trim();
      const note = m.querySelector("#pubNote").value.trim();
      if(!ver){ toast("版本号不能为空"); return false; }
      draft.meta.version = ver;
      draft.meta.updated = nowStr();
      draft.meta.mode = "published";
      draft.meta.changelog = draft.meta.changelog || [];
      draft.meta.changelog.unshift({ v: ver, at: nowStr(), by: "配置中台", note: note || "发布" });

      download("ovem-data.js", dataFileText(draft));
      localStorage.setItem(LS.exp, nowStr());
      BASE = clone(draft);
      localStorage.removeItem(LS.draft);
      ISSUE_CACHE = null;
      toast("已导出 ovem-data.js，覆盖 data/ 目录后刷新前台");
      render();
    }, "发布并导出");
}

/* ---------------- 快捷键 ---------------- */
document.addEventListener("keydown", e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s"){
    e.preventDefault();
    saveDraft();
  }
});

/* ---------------- 启动 ---------------- */
function init(){
  render();
}

if(!S || !FILE_DATA){ fatal(); } else { init(); }
</script>
